<section class="product-detail section" id="productDetail" data-product-id="{{id}}">
 <nav class="pw-breadcrumb" aria-label="Breadcrumb"><a href="/">HOME</a><span>/</span><a href="/shop">SHOP</a><span>/</span><span>{{name}}</span></nav>
 <div class="detail-layout">
  <div class="detail-gallery"><img id="detailImg" src="{{img}}" alt="{{selectedName}} — Front"><div id="detailViews" class="product-views" role="group" aria-label="Product image views">{{views}}</div></div>
  <div class="detail-info"><span class="kicker">PERVERSE WORLD / APPAREL</span><h1 id="detailName">{{name}}</h1><p id="detailDescription">{{sub}}</p>{{options}}<p id="detailSelectedName">{{selectedName}}</p><strong class="detail-price" id="detailPrice">${{price}}</strong><span class="size-label">SELECT SIZE</span><div id="detailSizes" class="size-buttons"><button type="button" data-size="S" class="selected">S</button><button type="button" data-size="M">M</button><button type="button" data-size="L">L</button><button type="button" data-size="XL">XL</button><button type="button" data-size="2XL">2XL</button></div><button id="detailAdd" class="btn" type="button">ADD TO BAG</button><p id="detailStatus" role="status">Contact us about availability, sizing and orders.</p></div>
 </div>
</section>
