{{routeHero}}
<section id="contact" class="pw-contact"><div class="pw-contact-inner">
  <span class="pw-kicker">REACH OUT / THE WORLD IS LISTENING</span>
  <p>Questions about drops, sizes, or collaborations? Send a message.</p>
  <form id="contactForm" method="post" action="/api/submissions">
    <div class="pw-grid"><label>Name<input name="name" required maxlength="120" autocomplete="name"></label><label>Email<input name="email" type="email" required autocomplete="email"></label></div>
    <label>Subject<input name="subject" required maxlength="160"></label>
    <label>Message<textarea name="message" required maxlength="4000" rows="4"></textarea></label>
    <input name="website" class="pw-honey" tabindex="-1" aria-hidden="true" autocomplete="off">
    <div id="contact-challenge"></div>
    <button type="submit" disabled>SEND MESSAGE</button><p id="contact-status" role="status">Contact submissions will open once verification is configured.</p>
  </form>
  <noscript><p>Enable JavaScript to verify and send your message.</p></noscript>
</div></section>
