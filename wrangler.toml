name = "perverse-world"
main = "src/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true

[build]
command = "node scripts/prepare-worker.mjs"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin", "/admin/*", "/unsubscribe", "/newsletter/confirm", "/media/*", "/shop/*", "/about", "/about/*", "/collections", "/collections/*"]
html_handling = "drop-trailing-slash"
not_found_handling = "404-page"

[[routes]]
pattern = "perverseworld.com"
custom_domain = true

[[routes]]
pattern = "www.perverseworld.com"
custom_domain = true

[[d1_databases]]
binding = "DB"
database_name = "perverse-world-production"
database_id = "8a56b510-00a9-49b8-88fd-17e01c870f08"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "PRODUCT_IMAGES"
bucket_name = "perverse-world"

[vars]
PUBLIC_BASE_URL = "https://perverseworld.com"
TURNSTILE_SITE_KEY = "0x4AAAAAAF9YFQ6JV7lvo3O1" # Cloudflare Turnstile public site key; configure before launch
ADMIN_ACCESS_ISSUER = "https://getsparqd-server.cloudflareaccess.com"
ADMIN_ACCESS_AUD = "6c39d5ff7d617d01bc753b79432667e179e1c904839531fa7d013c374a827f28"
ADMIN_ALLOWED_EMAILS = "hligon@getsparqd.com, marky021546@gmail.com"
INBOUND_DOMAIN = "perverseworld.com"
FROM_EMAIL = "updates@perverseworld.com"
MAILBOX_FROM_EMAIL = "info@perverseworld.com"
INBOUND_ADDRESS = "info@perverseworld.com"
NOTIFICATION_EMAIL = "info@perverseworld.com"
CLOUDFLARE_CONFIGURATION_VERIFIED = "true"

[triggers]
crons = ["*/5 * * * *"]

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true
